# Spring Boot 应用配置
spring:
  application:
    name: data-stream-migration
  
  # 激活的 profile（可选：dev, test, prod）
  profiles:
    active: dev  # 默认激活开发环境
  
  # 禁用 Spring Boot DevTools 避免热部署冲突
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  

# 日志配置
logging:
  level:
    root: INFO
    com.datastream.migration: DEBUG
    com.datastream.migration.stats: INFO
    com.datastream.migration.db.error: ERROR
    com.datastream.migration.rocksdb.error: ERROR
    # 关闭 Spring Boot 自动配置报告
    org.springframework.boot.autoconfigure: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
